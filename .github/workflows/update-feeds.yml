name: Update product feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download and split the source feed
        env:
          ARMORS_FEED_URL: ${{ secrets.ARMORS_FEED_URL }}
        run: python scripts/split_feed.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload feeds to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish feeds
        id: deployment
        uses: actions/deploy-pages@v4
